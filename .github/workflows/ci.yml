name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run JavaScript actions on Node 24 now (the default from 2026-06-16).  This
# silences the Node 20 deprecation warnings, including those from the actions
# that alire-project/setup-alire@v6 (the latest) pins internally
# (actions/cache/restore, actions/setup-node), which we can't bump ourselves.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Alire + GNAT toolchain
        uses: alire-project/setup-alire@v6
        # Defaults: alr 2.1.1, toolchain "gnat_native gprbuild".

      - name: Build the library (validation profile)
        # The `validation` profile adds -gnatwe (warnings are errors),
        # -gnata (assertions/contracts) and -gnato (overflow checks) on top
        # of the default warning + style set, so CI fails on any warning.
        # The profile is persisted in config/ and inherited by later steps.
        run: alr --non-interactive build --validation

      - name: Run the test suite (debug -O0 and release -O3)
        # `alr test` builds tests/test_sml.gpr and runs the AUnit runner, which
        # exits non-zero on any failed assertion.  It builds and runs the suite
        # in both optimization modes (debug -O0, release -O3), so the generic
        # engine is exercised at each -O level.  The suite also instantiates the
        # machine both with and without tracing, so both compile here too.
        run: alr --non-interactive test

      - name: Build & run the release example (-O3, no tracing)
        run: make run

      - name: Build & run the debug example (-O0, tracing)
        # Per-profile build dirs (bin/<profile>) mean no clean is needed between
        # the release and debug builds.
        run: make run-trace

  proof:
    name: SPARK proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Alire + GNAT toolchain
        uses: alire-project/setup-alire@v6

      - name: Build
        # Populates the shared dependency cache so the proof project's tree
        # (which withs aunit via the generated config) resolves for gnatprove.
        run: alr --non-interactive build

      - name: Install gnatprove
        run: |
          alr --non-interactive install --prefix="$HOME/.alire" gnatprove
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Prove
        # --checks-as-errors=on fails the job if any check is unproved;
        # --warnings=error fails it on any flow warning too (an output the
        # caller never reads is a bug or a dead parameter, never noise).
        run: |
          alr exec -- gnatprove -P proof/proof.gpr -j0 --level=2 \
            --checks-as-errors=on --warnings=error

  format:
    name: Formatting (gnatformat --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Alire + GNAT toolchain
        uses: alire-project/setup-alire@v6

      - name: Install gnatformat
        run: |
          alr --non-interactive install --prefix="$HOME/.alire" gnatformat_bin
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        # Tables are wrapped in --!format off/on, so their alignment is kept.
        run: |
          files=$(git ls-files 'src/*.ad[sb]' 'tests/src/*.ad[sb]' \
                               'proof/src/*.ad[sb]' 'support/src/*.ad[sb]' \
                               'example/src/*.ad[sb]' 'example/cfg/*.ad[sb]')
          echo "Checking:"; echo "$files"
          gnatformat --no-project --check $files
